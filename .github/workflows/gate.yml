name: gate

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contrast gate
        run: python tools/check_contrast.py
      - name: Gate tests
        run: python -m unittest discover -s tools -v
      - name: tokens.json matches tokens.css
        run: |
          python tools/build_tokens.py
          git diff --exit-code tokens.json
